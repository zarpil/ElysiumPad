version: '3.8'

services:
  # Base de Datos Relacional de Producción
  elysiumpad-db:
    image: postgres:16-alpine
    container_name: elysiumpad-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elysiumpass}
      POSTGRES_DB: ${POSTGRES_DB:-elysiumpad}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-elysiumpad}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - elysium-network

  # Aplicación Web y API de ElysiumPad
  elysiumpad-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elysiumpad-web
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-elysiumpass}@elysiumpad-db:5432/${POSTGRES_DB:-elysiumpad}?schema=public
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-elysiumpad-super-secret-key-change-in-prod-12345}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@elysiumpad.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-admin123456}
      # Cloudflare R2 (Almacenamiento de Mods y Assets)
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-minecraft-launchers}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}
      # Pasarela de Pagos (Stripe)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "${APP_PORT:-38472}:3000"
    volumes:
      # Persistencia de uploads locales (logos, banners y mods si no se usa R2)
      - elysiumpad_uploads:/app/public/uploads
    depends_on:
      elysiumpad-db:
        condition: service_healthy
    networks:
      - elysium-network

  # Cloudflare Tunnel (Opcional para publicar con HTTPS y anti-DDoS gratis)
  # Para activarlo: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: elysiumpad-tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - elysiumpad-web
    networks:
      - elysium-network
    profiles:
      - tunnel

volumes:
  postgres_data:
  elysiumpad_uploads:

networks:
  elysium-network:
    driver: bridge
